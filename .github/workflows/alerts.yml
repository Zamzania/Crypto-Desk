name: Pantau zona entry & kirim notifikasi

# Dipicu dari luar setiap 5 menit (cron-job.org memanggil workflow_dispatch),
# karena jadwal bawaan GitHub sering telat berjam-jam. Jadwal di bawah hanya cadangan.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hitung rencana & kirim notifikasi
        run: node scripts/alerts.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_MIN_CONF: ${{ vars.ALERT_MIN_CONF || '60' }}
      - name: Simpan status sinyal bila berubah
        run: |
          git config user.name "crypto-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "Perbarui sinyal entry"
          git pull --rebase -q || true
          git push
