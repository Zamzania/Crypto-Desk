name: Kumpulkan berita & listing

on:
  schedule:
    - cron: "17 */3 * * *"   # setiap 3 jam (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kumpulkan data
        run: node scripts/collect.mjs
      - name: Simpan bila berubah
        run: |
          git config user.name "crypto-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/listings.json data/markets.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "Perbarui berita dan listing otomatis"
          git push
